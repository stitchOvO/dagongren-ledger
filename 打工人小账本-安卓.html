<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>打工人小账本 · 安卓</title>
<style>
:root {
  --md-primary: #6750A4; --md-on-primary: #FFFFFF;
  --md-primary-container: #EADDFF; --md-on-primary-container: #21005D;
  --md-secondary: #625B71; --md-secondary-container: #E8DEF8;
  --md-tertiary: #7D5260; --md-tertiary-container: #FFD8E4;
  --md-error: #B3261E; --md-error-container: #F9DEDC;
  --md-surface: #FFFBFE; --md-surface-variant: #E7E0EC;
  --md-on-surface: #1C1B1F; --md-on-surface-variant: #49454F;
  --md-outline: #79747E; --md-outline-variant: #CAC4D0;
  --md-bg: #FEF7FF;
  --radius: 28px; --radius-sm: 16px; --radius-xs: 12px;
  --elevation-1: 0 1px 2px rgba(0,0,0,.15), 0 1px 3px 1px rgba(0,0,0,.1);
  --elevation-2: 0 1px 2px rgba(0,0,0,.15), 0 2px 6px 2px rgba(0,0,0,.1);
  --elevation-3: 0 4px 8px 3px rgba(0,0,0,.1), 0 1px 3px rgba(0,0,0,.15);
  --font: Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --bottom-nav-h: 64px; --safe-bottom: env(safe-area-inset-bottom, 8px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
@supports(-webkit-overflow-scrolling:touch){html,body{position:fixed;width:100%;height:100%;overflow:hidden}}
body{font-family:var(--font);background:var(--md-bg);color:var(--md-on-surface);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;outline:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative;overflow:hidden}
button::after{content:'';position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s;pointer-events:none}
button:active::after{opacity:.12}
input,select,textarea{outline:none;border:1px solid var(--md-outline-variant);border-radius:var(--radius-xs);padding:12px 16px;background:var(--md-surface);transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--md-primary);box-shadow:0 0 0 2px var(--md-primary-container)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--md-outline-variant);border-radius:4px}

.app{display:flex;flex-direction:column;height:100%;position:relative}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;padding-bottom:calc(var(--bottom-nav-h) + var(--safe-bottom) + 24px);-webkit-overflow-scrolling:touch}
.page-title{font-size:24px;font-weight:400;color:var(--md-on-surface);margin-bottom:20px;letter-spacing:-.5px}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:var(--bottom-nav-h);
  background:var(--md-surface);display:flex;justify-content:space-around;align-items:center;
  z-index:20;padding-bottom:var(--safe-bottom);
  box-shadow:var(--elevation-2);
}
.bottom-nav .bn-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--md-on-surface-variant);
  font-size:11px;font-weight:500;flex:1;min-width:0;transition:all .2s;
}
.bottom-nav .bn-item.active{color:var(--md-primary)}
.bottom-nav .bn-item svg{width:24px;height:24px;opacity:.6;transition:opacity .2s}
.bottom-nav .bn-item.active svg{opacity:1}

/* FAB */
.fab{position:fixed;right:16px;bottom:calc(var(--bottom-nav-h) + var(--safe-bottom) + 16px);width:56px;height:56px;border-radius:16px;background:var(--md-primary-container);color:var(--md-on-primary-container);box-shadow:var(--elevation-3);display:flex;align-items:center;justify-content:center;z-index:30;transition:all .2s}
.fab:active{transform:scale(.92)}
.fab svg{width:24px;height:24px}

.card{background:var(--md-surface);border-radius:var(--radius-sm);padding:16px;box-shadow:var(--elevation-1);margin-bottom:12px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-title{font-size:14px;font-weight:500;color:var(--md-on-surface-variant);text-transform:uppercase;letter-spacing:.5px}
.card-sub{font-size:12px;color:var(--md-outline)}
.section-title{font-size:15px;font-weight:500;margin:20px 0 12px;color:var(--md-on-surface)}

.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:var(--md-surface);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--elevation-1);position:relative}
.stat-card .stat-label{font-size:11px;color:var(--md-on-surface-variant);margin-bottom:4px}
.stat-card .stat-value{font-size:22px;font-weight:400;color:var(--md-on-surface)}
.stat-card.accent-primary{border-top:3px solid var(--md-primary)}
.stat-card.accent-error{border-top:3px solid var(--md-error)}
.stat-card.accent-tertiary{border-top:3px solid var(--md-tertiary)}

.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:8px;font-size:10px;font-weight:500}
.badge.income{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.badge.expense{background:var(--md-error-container);color:var(--md-error)}
.badge.demo{background:var(--md-secondary-container);color:var(--md-secondary);margin-left:6px;font-size:9px}

.txn-list{display:flex;flex-direction:column;gap:6px}
.txn-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--md-surface-variant);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s}
.txn-item:active{background:var(--md-primary-container);transform:scale(.98)}
.txn-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.txn-icon.inc{background:var(--md-primary-container)}
.txn-icon.exp{background:var(--md-error-container)}
.txn-info{flex:1;min-width:0}
.txn-cat{font-size:14px;font-weight:500}
.txn-note{font-size:12px;color:var(--md-on-surface-variant);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn-date{font-size:11px;color:var(--md-outline)}
.txn-amount{font-weight:500;font-size:16px;text-align:right;white-space:nowrap}
.txn-amount.inc-c{color:var(--md-primary)}
.txn-amount.exp-c{color:var(--md-error)}
.txn-time{font-size:10px;color:var(--md-outline);text-align:right}

.quick-form{display:flex;flex-direction:column;gap:10px}
.quick-amounts{display:flex;flex-wrap:wrap;gap:6px}
.quick-amt{padding:8px 18px;border-radius:20px;font-size:14px;font-weight:500;background:var(--md-surface-variant);color:var(--md-on-surface-variant);transition:all .15s;border:1px solid transparent}
.quick-amt.selected{background:var(--md-primary-container);color:var(--md-on-primary-container);border-color:var(--md-primary)}
.amount-input{font-size:22px;font-weight:400;text-align:center;background:transparent;border:none;border-bottom:2px solid var(--md-primary);border-radius:0;padding:8px 4px}
.type-toggle{display:flex;background:var(--md-surface-variant);border-radius:24px;padding:4px}
.type-toggle button{flex:1;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:500;color:var(--md-on-surface-variant);transition:all .2s}
.type-toggle button.active{background:var(--md-primary);color:var(--md-on-primary)}
.cat-chips{display:flex;flex-wrap:wrap;gap:6px}
.cat-chip{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;background:var(--md-surface-variant);color:var(--md-on-surface-variant);transition:all .15s}
.cat-chip.selected{background:var(--md-primary-container);color:var(--md-on-primary-container);font-weight:600}
.cat-chip.exp-chip.selected{background:var(--md-error-container);color:var(--md-error)}
.record-counter{font-size:11px;color:var(--md-outline);text-align:center;margin-top:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 24px;border-radius:20px;font-size:14px;font-weight:500;transition:all .15s;white-space:nowrap;position:relative}
.btn-primary{background:var(--md-primary);color:var(--md-on-primary);box-shadow:var(--elevation-1)}
.btn-outline{border:1px solid var(--md-outline);color:var(--md-primary)}
.btn-error{background:var(--md-error);color:#fff}
.btn-sm{padding:8px 16px;font-size:12px;border-radius:16px}
.btn-block{width:100%}

.slider-group{margin:10px 0}
.slider-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:var(--md-on-surface-variant)}
.slider-label span:last-child{font-weight:500;color:var(--md-primary)}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--md-surface-variant);outline:none;border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--md-primary);cursor:pointer;box-shadow:var(--elevation-1)}

.formula-box{background:var(--md-surface-variant);border-radius:var(--radius-sm);padding:14px;margin:8px 0;font-family:"Roboto Mono",monospace;font-size:12px;line-height:1.8;white-space:pre-wrap;color:var(--md-on-surface-variant)}

.chart-container{width:100%;overflow-x:auto;padding:4px 0}
.chart-container svg{display:block;min-width:300px}
.piggy-wrap{text-align:center;padding:10px 0}
.piggy-wrap svg{max-width:140px}

.sync-code{background:var(--md-surface-variant);border:1px dashed var(--md-primary);border-radius:var(--radius-sm);padding:12px;font-family:"Roboto Mono",monospace;font-size:10px;word-break:break-all;max-height:100px;overflow-y:auto;user-select:all;-webkit-user-select:all;margin-bottom:8px;line-height:1.6}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--md-on-surface);color:var(--md-surface);padding:10px 24px;border-radius:20px;font-size:13px;font-weight:500;z-index:100;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:var(--md-surface);border-radius:24px 24px 0 0;padding:24px;width:100%;max-width:420px;margin:0 auto;box-shadow:var(--elevation-3)}
.modal h3{font-size:18px;font-weight:400;margin-bottom:12px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div class="app">
  <div class="content" id="contentArea"></div>
</div>

<nav class="bottom-nav" id="bottomNav">
  <button class="bn-item active" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>首页</button>
  <button class="bn-item" data-page="record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>记账</button>
  <button class="bn-item" data-page="savings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/></svg>存款</button>
  <button class="bn-item" data-page="sync"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>同步</button>
  <button class="bn-item" data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</button>
</nav>
<button class="fab" onclick="navigateTo('record')" title="快速记账">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div class="modal-overlay" id="confirmModal"><div class="modal"><h3>确认操作</h3><p id="confirmMsg"></p><div class="modal-actions"><button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button><button class="btn btn-error btn-sm" id="confirmBtn">确认</button></div></div></div>

<script>
const STORAGE_KEY='worker_ledger_android';
const CATS_INCOME=['工资','奖金','副业','理财','红包','报销','其他收入'];
const CATS_EXPENSE=['餐饮','房租','交通','购物','通讯','水电','娱乐','学习','医疗','服饰','日用','其他支出'];
const CATS_FIXED=['房租','房贷','水电','通讯','交通卡','保险','物业'];
const PAGE_TITLES={home:'打工人小账本',record:'闪电记账',savings:'存款目标',sync:'设备同步',settings:'设置'};
const STORAGE_VERSION=2,LS_MAX_SIZE=5*1024*1024;

let appData={transactions:[],settings:{monthlySalary:12000,payMonths:13,yearlyWorkCost:8000,dailyPresence:9,commuteMin:60,overtimeMonth:10,workDaysYear:250},goals:{freedomFund:800000,safetyCushion:60000}};
let currentPage='home',confirmCallback=null,recSessionCount=0,recSubmitLock=false;

function $(s){const el=document.querySelector(s);if(!el)console.warn('[$]',s);return el}
function $$(s){return document.querySelectorAll(s)}
function esc(s){if(!s)return'';const d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML}
function fmt(n,d=0){const v=Number(n);return(isNaN(v)?0:v).toFixed(d)}
function fmtMoney(n){const v=Number(n);return'¥'+(isNaN(v)?0:v).toLocaleString('zh-CN',{maximumFractionDigits:0})}
function fmtShortMoney(n){const v=Number(n);if(isNaN(v))return'¥0';if(Math.abs(v)>=10000)return'¥'+(v/10000).toFixed(1)+'万';return fmtMoney(v)}
function today(){const d=new Date();if(isNaN(d.getTime()))return new Date().toISOString().slice(0,10);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function thisMonth(){const d=new Date();if(isNaN(d.getTime()))return new Date().toISOString().slice(0,7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function isValidDateStr(s){return!(!s||typeof s!=='string')&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s).getTime())}
function clampDateStr(s){return isValidDateStr(s)?s:today()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function toast(msg){const el=$('#toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}

function calcHourlyWage(s){const ms=Math.max(0,Number(s.monthlySalary)||0),pm=Math.max(1,Number(s.payMonths)||12),wc=Math.max(0,Number(s.yearlyWorkCost)||0),wd=Math.max(1,Number(s.workDaysYear)||250),dp=Math.max(0,Number(s.dailyPresence)||0),cm=Math.max(0,Number(s.commuteMin)||0),om=Math.max(0,Number(s.overtimeMonth)||0);const ym=wd*(dp*60+cm)+om*pm*60,yn=ms*pm-wc;if(ym<=0)return{hourly:0,yearNet:yn,yearMinutes:0,formula:'请设置参数'};const h=Math.max(0,yn/(ym/60));return{hourly:h,yearNet:yn,yearMinutes:ym,formula:`真实时薪 = (${fmtMoney(ms)}×${pm} - ${fmtMoney(wc)}) ÷ (${wd}×(${dp}h+${(cm/60).toFixed(1)}h) + ${om*pm}h) = ${fmtMoney(h,2)}/h`}}

function getMonthTxns(ym){return appData.transactions.filter(t=>t.date.startsWith(ym))}
function getRecentTxns(n=4){return[...appData.transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,n)}
function txWorkMinutes(amount,s){const hw=calcHourlyWage(s);if(!hw||hw.hourly<=0)return 0;return Math.round((Math.abs(Number(amount)||0)/hw.hourly)*60)}
function addTxn(type,category,amount,note){const s=appData.settings,st=(type==='income'||type==='expense')?type:'expense';const sa=Math.max(0,Math.abs(Number(amount)||0)),wm=st==='expense'?txWorkMinutes(sa,s):0;const txn={id:uid(),date:today(),type:st,category:String(category||'其他支出'),amount:sa,note:String(note||''),workMinutes:wm};appData.transactions.push(txn);saveData();return txn}
function deleteTxn(id){appData.transactions=appData.transactions.filter(t=>t.id!==id);saveData()}

function compactStorage(){return{v:STORAGE_VERSION,t:appData.transactions.map(tx=>({i:tx.id,d:tx.date,p:tx.type[0],c:tx.category,a:tx.amount,n:tx.note||'',w:tx.workMinutes||0})),s:appData.settings,g:appData.goals}}
function expandStorage(c){if(!c||!Array.isArray(c.t))return;appData.transactions=c.t.map(tx=>({id:String(tx.i||''),date:clampDateStr(tx.d),type:tx.p==='i'?'income':'expense',category:String(tx.c||'其他支出'),amount:Math.max(0,Number(tx.a)||0),note:String(tx.n||''),workMinutes:Math.max(0,Number(tx.w)||0)}));if(c.s)appData.settings={...appData.settings,...c.s};if(c.g)appData.goals={...appData.goals,...c.g}}
function getStorageSize(){const raw=localStorage.getItem(STORAGE_KEY);return raw?new Blob([raw]).size:0}
function fmtStorage(bytes){if(bytes<1024)return bytes+' B';if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';return(bytes/1048576).toFixed(2)+' MB'}

function saveData(){const payload=JSON.stringify(compactStorage());if(payload.length>LS_MAX_SIZE){toast('⚠️ 数据过大');return false}try{localStorage.setItem(STORAGE_KEY,payload)}catch(e){toast('⚠️ 存储空间不足');return false}return true}
function loadData(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw){generateDemoData();saveData();return}const d=JSON.parse(raw);if(!d||typeof d!=='object'){generateDemoData();saveData();return}if(d.v===STORAGE_VERSION&&Array.isArray(d.t))expandStorage(d);else if(Array.isArray(d.transactions)){appData.transactions=d.transactions.filter(tx=>tx&&tx.id&&tx.date);if(d.settings)appData.settings={...appData.settings,...d.settings};if(d.goals)appData.goals={...appData.goals,...d.goals};saveData()}else{generateDemoData();saveData()}}catch(e){generateDemoData();saveData()}}

function generateDemoData(){const now=new Date(),s=appData.settings;appData.transactions=[];for(let m=1;m<=3;m++){const d=new Date(now);d.setMonth(d.getMonth()-m);d.setDate(10);const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');appData.transactions.push({id:'demo-salary-'+m,date:ds,type:'income',category:'工资',amount:Number(s.monthlySalary)||12000,note:'月薪到账 [示例]',workMinutes:0})}const fi=[{cat:'房租',amt:2800,note:'合租 [示例]'},{cat:'水电',amt:180,note:'水电 [示例]'},{cat:'通讯',amt:89,note:'话费 [示例]'},{cat:'交通卡',amt:200,note:'通勤 [示例]'}];const fl=[{cat:'餐饮',amt:35,note:'外卖 [示例]'},{cat:'餐饮',amt:28,note:'咖啡 [示例]'},{cat:'餐饮',amt:68,note:'聚餐 [示例]'},{cat:'购物',amt:159,note:'日用品 [示例]'},{cat:'购物',amt:299,note:'T恤 [示例]'},{cat:'娱乐',amt:45,note:'会员 [示例]'},{cat:'学习',amt:199,note:'课程 [示例]'},{cat:'医疗',amt:86,note:'买药 [示例]'},{cat:'餐饮',amt:42,note:'晚餐 [示例]'},{cat:'交通',amt:15,note:'打车 [示例]'}];const cmY=now.getFullYear(),cmM=now.getMonth(),cmDay=now.getDate();fi.forEach((f,i)=>{const d=new Date(cmY,cmM,Math.min(5+i,28));if(d>now)d.setDate(Math.max(1,cmDay-1));const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');appData.transactions.push({id:'demo-fixed-'+i,date:ds,type:'expense',category:f.cat,amount:f.amt,note:f.note,workMinutes:txWorkMinutes(f.amt,s)})});fl.forEach((f,i)=>{const offset=Math.max(1,fl.length-i),d=new Date(cmY,cmM,Math.max(1,cmDay-offset));if(d>now)d.setDate(Math.max(1,cmDay-1));const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');appData.transactions.push({id:'demo-flex-'+i,date:ds,type:'expense',category:f.cat,amount:f.amt,note:f.note,workMinutes:txWorkMinutes(f.amt,s)})})}

function renderTxnItem(t,dm=true){if(!t||!t.id)return'';const inc=t.type==='income',p=inc?'+':'-';const is=inc?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--md-primary)" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--md-error)" stroke-width="2"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/></svg>';const db=(dm&&t.note&&t.note.includes('[示例]'))?'<span class="badge demo">示例</span>':'';const wt=inc?'':(t.workMinutes>0?`<div class="txn-time">≈ ${t.workMinutes}分工</div>`:'');const si=esc(t.id);return`<div class="txn-item" data-id="${si}" onclick="confirmDeleteTxn('${si}')"><div class="txn-icon ${inc?'inc':'exp'}">${is}</div><div class="txn-info"><div class="txn-cat">${esc(t.category)}${db}</div><div class="txn-note">${esc(t.note||'')}</div><div class="txn-date">${esc(t.date)}</div></div><div style="text-align:right"><div class="txn-amount ${inc?'inc-c':'exp-c'}">${p}${fmtMoney(t.amount)}</div>${wt}</div></div>`}

function renderHome(){const recent=getRecentTxns(4),ym=thisMonth(),mt=getMonthTxns(ym);const ti=mt.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),tf=mt.filter(t=>t.type==='expense'&&CATS_FIXED.includes(t.category)).reduce((a,t)=>a+t.amount,0),tfl=mt.filter(t=>t.type==='expense'&&!CATS_FIXED.includes(t.category)).reduce((a,t)=>a+t.amount,0);const hw=calcHourlyWage(appData.settings);let h='<h1 class="page-title">你好，打工人 👋</h1>';h+='<div class="stats-row">';h+=`<div class="stat-card accent-primary"><div class="stat-label">本月收入</div><div class="stat-value">${fmtMoney(ti)}</div></div>`;h+=`<div class="stat-card accent-error"><div class="stat-label">本月支出</div><div class="stat-value">${fmtMoney(tf+tfl)}</div></div>`;h+=`<div class="stat-card"><div class="stat-label">本月结余</div><div class="stat-value" style="color:${ti-tf-tfl>=0?'var(--md-primary)':'var(--md-error)'}">${fmtMoney(ti-tf-tfl)}</div></div>`;h+=`<div class="stat-card accent-tertiary"><div class="stat-label">时薪</div><div class="stat-value">${fmtMoney(hw.hourly,2)}/h</div></div></div>`;h+='<div class="card"><div class="card-header"><span class="card-title">最近 4 笔</span><button class="btn btn-primary btn-sm" onclick="navigateTo(\'record\')">记一笔</button></div><div class="txn-list">';if(recent.length===0)h+='<div style="text-align:center;padding:24px;color:var(--md-outline)">还没有记录 ✍️</div>';else recent.forEach(t=>{h+=renderTxnItem(t)});h+='</div></div>';h+=`<div class="card"><div class="card-header"><span class="card-title">本月小结</span><span class="card-sub">${ym}</span></div><div style="display:flex;flex-direction:column;gap:6px;font-size:13px"><div style="display:flex;justify-content:space-between"><span>💰 收入</span><span style="color:var(--md-primary);font-weight:500">${fmtMoney(ti)}</span></div><div style="display:flex;justify-content:space-between"><span>📌 固定</span><span style="color:var(--md-error)">-${fmtMoney(tf)}</span></div><div style="display:flex;justify-content:space-between"><span>🎈 弹性</span><span style="color:var(--md-error)">-${fmtMoney(tfl)}</span></div><div style="border-top:1px solid var(--md-outline-variant);padding-top:6px;display:flex;justify-content:space-between;font-weight:500"><span>💎 结余</span><span style="color:${ti-tf-tfl>=0?'var(--md-primary)':'var(--md-error)'}">${fmtMoney(ti-tf-tfl)}</span></div></div></div>`;$('#contentArea').innerHTML=h}

function renderRecord(){let h=`<div class="card"><div class="quick-form" id="recordForm"><div class="type-toggle" id="typeToggle"><button class="active" data-type="expense">💸 支出</button><button data-type="income">💰 收入</button></div><div class="quick-amounts" id="quickAmts"><button class="quick-amt" data-amt="20">¥20</button><button class="quick-amt" data-amt="35">¥35</button><button class="quick-amt" data-amt="50">¥50</button><button class="quick-amt" data-amt="100">¥100</button><button class="quick-amt" data-amt="200">¥200</button><button class="quick-amt" data-amt="0">自填</button></div><input type="number" class="amount-input" id="recAmount" placeholder="0.00" step="0.01" min="0" inputmode="decimal"><div id="catChips" class="cat-chips"></div><input type="text" id="recNote" placeholder="备注（选填，回车保存）" maxlength="50"><button class="btn btn-primary btn-block" id="recSubmitBtn">💾 保存 (Enter)</button><div class="record-counter" id="recCounter"></div></div></div>`;const recent=getRecentTxns(15);h+='<div class="section-title">最近记录</div><div class="txn-list">';if(recent.length===0)h+='<div style="text-align:center;padding:24px;color:var(--md-outline)">暂无记录</div>';else recent.forEach(t=>{h+=renderTxnItem(t)});h+='</div>';$('#contentArea').innerHTML=h;$('#recCounter').textContent=recSessionCount>0?`已记 ${recSessionCount} 笔`:'⚡ 选金额 → 点分类 → 回车';$('#typeToggle').addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;const t=b.dataset.type;this.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const cc=document.getElementById('catChips');cc.dataset.type=t;renderCatChips(t)});renderCatChips('expense');document.getElementById('catChips').dataset.type='expense';$('#quickAmts').addEventListener('click',function(e){const b=e.target.closest('.quick-amt');if(!b)return;const a=parseInt(b.dataset.amt);this.querySelectorAll('.quick-amt').forEach(x=>x.classList.remove('selected'));if(a===0){$('#recAmount').value='';$('#recAmount').focus();return}b.classList.add('selected');$('#recAmount').value=a;autoSubmit()});setTimeout(()=>{const fc=$('#catChips .cat-chip');if(fc)fc.classList.add('selected');$('#recAmount').focus()},50);const form=$('#recordForm');form.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitRecord()}});$('#recSubmitBtn').addEventListener('click',function(e){e.preventDefault();submitRecord()});function autoSubmit(){const a=parseFloat($('#recAmount').value);const c=$('#catChips .cat-chip.selected');if(!isNaN(a)&&a>0&&c)submitRecord()}}function renderCatChips(type){const cats=type==='income'?CATS_INCOME:CATS_EXPENSE,isExp=type==='expense';document.getElementById('catChips').innerHTML=cats.map((c,i)=>`<button class="cat-chip${isExp?' exp-chip':''}${i===0?' selected':''}" data-cat="${c}">${c}</button>`).join('')}
function submitRecord(){if(recSubmitLock)return;recSubmitLock=true;try{const t=$('#catChips').dataset.type||'expense';const ae=$('#recAmount');if(!ae){recSubmitLock=false;return}const a=parseFloat(ae.value);const ne=$('#recNote');const n=ne?ne.value.trim():'';const sc=$('#catChips .cat-chip.selected');if(isNaN(a)||a<=0){toast('请输入金额');if(ae)ae.focus();recSubmitLock=false;return}if(!sc){toast('请选择分类');recSubmitLock=false;return}const txn=addTxn(t,sc.dataset.cat,a,n);if(ae)ae.value='';if(ne)ne.value='';const qa=$('#quickAmts');if(qa)qa.querySelectorAll('.quick-amt').forEach(b=>b.classList.remove('selected'));recSessionCount++;const cnt=$('#recCounter');if(cnt)cnt.textContent=`已记 ${recSessionCount} 笔`;toast(`已存 ${txn.category} ¥${a} ${txn.workMinutes>0?'≈'+txn.workMinutes+'分':''}`);const recent=getRecentTxns(15);let lh='';if(recent.length===0)lh='<div style="text-align:center;padding:24px;color:var(--md-outline)">暂无记录</div>';else recent.forEach(tx=>{lh+=renderTxnItem(tx)});const tl=$('#contentArea .txn-list');if(tl)tl.innerHTML=lh;setTimeout(()=>{const fc=$('#catChips .cat-chip');if(fc)fc.classList.add('selected');if(ae)ae.focus()},50)}finally{recSubmitLock=false}}
document.addEventListener('click',function(e){const chip=e.target.closest('.cat-chip');if(chip){const c=chip.parentElement;if(!c)return;c.querySelectorAll('.cat-chip').forEach(x=>x.classList.remove('selected'));chip.classList.add('selected');const ae=$('#recAmount');if(ae&&!recSubmitLock){const a=parseFloat(ae.value);if(!isNaN(a)&&a>0)submitRecord()}}});

function renderSavings(){const s=appData.settings,g=appData.goals,ym=thisMonth(),mt=getMonthTxns(ym);const ti=mt.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),te=mt.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0),ms=ti-te;let rt=0;const sorted=[...appData.transactions].sort((a,b)=>a.date.localeCompare(b.date)),md=[],mm=new Map();sorted.forEach(t=>{const m=t.date.slice(0,7);mm.set(m,(mm.get(m)||0)+(t.type==='income'?t.amount:-t.amount))});[...mm.keys()].sort().forEach(m=>{rt+=mm.get(m);md.push({month:m,balance:Math.max(0,rt)})});const pd=[...md];if(ms>0){let lb=pd.length>0?pd[pd.length-1].balance:0;for(let i=1;i<=12;i++){const d=new Date();d.setMonth(d.getMonth()+i);lb+=ms;pd.push({month:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),balance:lb,projected:true})}}let h='<h1 class="page-title">🐷 存款目标</h1>';h+=renderPiggy();h+=`<div class="stats-row"><div class="stat-card accent-primary"><div class="stat-label">🎯 自由基金</div><div class="stat-value">${fmtShortMoney(g.freedomFund)}</div></div><div class="stat-card accent-error"><div class="stat-label">🛡️ 安全垫</div><div class="stat-value">${fmtShortMoney(g.safetyCushion)}</div></div></div>`;const cd=md.length>0?md[md.length-1].balance:0;h+=`<div class="card"><div class="card-header"><span class="card-title">当前存款</span></div><div style="font-size:28px;font-weight:400;text-align:center">${fmtMoney(cd)}</div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--md-on-surface-variant);margin-top:6px"><span>自由基金: ${g.freedomFund>0?fmt(cd/g.freedomFund*100,1):0}%</span><span>安全垫: ${g.safetyCushion>0?fmt(cd/g.safetyCushion*100,1):0}%</span></div><div style="height:6px;background:var(--md-surface-variant);border-radius:3px;margin-top:6px;overflow:hidden"><div style="height:100%;background:var(--md-primary);border-radius:3px;width:${Math.min(100,g.freedomFund>0?cd/g.freedomFund*100:0)}%"></div></div></div>`;h+=`<div class="card"><div class="card-header"><span class="card-title">存款曲线</span></div>${renderDepositChart(md,pd,g.freedomFund,g.safetyCushion)}</div>`;h+=`<div class="card"><div class="card-title" style="margin-bottom:10px">调整目标</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label style="font-size:11px;color:var(--md-on-surface-variant)">自由基金</label><input type="number" id="setFreedom" value="${g.freedomFund}" step="1000"></div><div><label style="font-size:11px;color:var(--md-on-surface-variant)">安全垫</label><input type="number" id="setCushion" value="${g.safetyCushion}" step="1000"></div></div><button class="btn btn-primary btn-block" onclick="updateGoals()" style="margin-top:8px">保存</button></div>`;h+=`<div class="card" style="background:var(--md-primary-container);border:none"><div style="font-size:12px;color:var(--md-on-primary-container);line-height:1.8">📊 本月结余: <b>${fmtMoney(ms)}</b> · 达自由基金约需 <b>${ms>0?Math.ceil((g.freedomFund-cd)/ms):'∞'}</b> 月</div></div>`;$('#contentArea').innerHTML=h}function updateGoals(){const g=appData.goals;g.freedomFund=parseFloat($('#setFreedom').value)||g.freedomFund;g.safetyCushion=parseFloat($('#setCushion').value)||g.safetyCushion;saveData();toast('已更新');renderSavings()}
function renderPiggy(){return`<div class="piggy-wrap"><svg viewBox="0 0 200 160" width="120" height="96"><ellipse cx="100" cy="90" rx="70" ry="50" fill="var(--md-primary-container)" opacity=".6"/><ellipse cx="100" cy="88" rx="62" ry="43" fill="var(--md-primary-container)" opacity=".4"/><ellipse cx="60" cy="45" rx="15" ry="12" fill="var(--md-primary)" opacity=".5" transform="rotate(-20,60,45)"/><ellipse cx="135" cy="45" rx="15" ry="12" fill="var(--md-primary)" opacity=".5" transform="rotate(20,135,45)"/><circle cx="75" cy="80" r="6" fill="var(--md-on-surface)"/><circle cx="77" cy="78" r="2" fill="#fff"/><circle cx="115" cy="80" r="6" fill="var(--md-on-surface)"/><circle cx="117" cy="78" r="2" fill="#fff"/><ellipse cx="95" cy="95" rx="18" ry="13" fill="var(--md-primary)" opacity=".4"/><path d="M85,100 Q95,110 105,100" fill="none" stroke="var(--md-on-surface)" stroke-width="1.5" stroke-linecap="round" opacity=".5"/><rect x="90" y="50" width="15" height="4" rx="2" fill="var(--md-on-surface)" opacity=".3"/><rect x="60" y="125" width="16" height="18" rx="6" fill="var(--md-primary)" opacity=".4"/><rect x="120" y="125" width="16" height="18" rx="6" fill="var(--md-primary)" opacity=".4"/><circle cx="50" cy="30" r="10" fill="var(--md-tertiary-container)" stroke="var(--md-tertiary)" stroke-width="1.5"/><text x="50" y="34" text-anchor="middle" font-size="9" fill="var(--md-on-surface)" font-weight="500">¥</text><text x="38" y="22" font-size="9" fill="var(--md-tertiary)">✦</text></svg></div>`}

function renderDepositChart(ad,pd,fg,sg){const w=600,h=220,p={top:16,r:16,b:36,l:56},al=[...pd];if(al.length===0)return'<div style="text-align:center;padding:30px;color:var(--md-outline)">暂无数据</div>';const mv=Math.max(Number(fg)*1.1,...al.map(d=>Number(d.balance)||0),1),xs=al.length<=1?0:(w-p.l-p.r)/(al.length-1),ys=(mv<=0)?0:(h-p.t-p.b)/mv;function x(i){return p.l+i*xs}function y(v){return h-p.b-Number(v)*ys}let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:600px;height:auto">`;for(let i=0;i<=4;i++){const v=mv*i/4,yy=y(v);s+=`<line x1="${p.l}" y1="${yy}" x2="${w-p.r}" y2="${yy}" stroke="var(--md-outline-variant)" stroke-width="1" stroke-dasharray="4,4"/><text x="${p.l-6}" y="${yy+4}" text-anchor="end" font-size="9" fill="var(--md-outline)">${fmtShortMoney(v)}</text>`}const fy=y(fg);s+=`<line x1="${p.l}" y1="${fy}" x2="${w-p.r}" y2="${fy}" stroke="var(--md-error)" stroke-width="1" stroke-dasharray="6,3"/><text x="${w-p.r}" y="${fy-4}" text-anchor="end" font-size="9" fill="var(--md-error)">自由 ${fmtShortMoney(fg)}</text>`;if(sg>0){const sy=y(sg);s+=`<line x1="${p.l}" y1="${sy}" x2="${w-p.r}" y2="${sy}" stroke="var(--md-tertiary)" stroke-width="1" stroke-dasharray="6,3"/><text x="${w-p.r}" y="${sy-4}" text-anchor="end" font-size="9" fill="var(--md-tertiary)">安全 ${fmtShortMoney(sg)}</text>`}let ap='';al.forEach((d,i)=>{if(i===0)ap+=`M${x(i)},${y(d.balance)}`;else ap+=` L${x(i)},${y(d.balance)}`});ap+=` L${x(al.length-1)},${y(0)} L${x(0)},${y(0)} Z`;s+=`<path d="${ap}" fill="var(--md-primary)" opacity="0.08"/>`;if(ad.length>0){let lp='';ad.forEach((d,i)=>{if(i===0)lp+=`M${x(i)},${y(d.balance)}`;else lp+=` L${x(i)},${y(d.balance)}`});s+=`<path d="${lp}" fill="none" stroke="var(--md-primary)" stroke-width="2" stroke-linecap="round"/>`;ad.forEach((d,i)=>{s+=`<circle cx="${x(i)}" cy="${y(d.balance)}" r="3" fill="var(--md-primary)"/>`})}const po=pd.filter(d=>d.projected);if(po.length>0){let pp='';if(ad.length>0)pp+=`M${x(ad.length-1)},${y(ad[ad.length-1].balance)}`;po.forEach((d,i)=>{pp+=` L${x(ad.length+i)},${y(d.balance)}`});s+=`<path d="${pp}" fill="none" stroke="var(--md-primary)" stroke-width="1.5" stroke-dasharray="6,4" opacity=".5"/>`;po.forEach((d,i)=>{s+=`<circle cx="${x(ad.length+i)}" cy="${y(d.balance)}" r="2" fill="var(--md-primary)" opacity=".5"/>`})}const ls=Math.max(1,Math.floor(al.length/8));al.forEach((d,i)=>{if(i%ls===0||i===al.length-1)s+=`<text x="${x(i)}" y="${h-p.b+14}" text-anchor="middle" font-size="9" fill="var(--md-outline)">${d.month.slice(2)}月</text>`});s+='</svg>';return`<div class="chart-container">${s}</div>`}

function genSyncCode(){return btoa(unescape(encodeURIComponent(JSON.stringify(compactStorage()))))}
function parseSyncCode(code){try{return JSON.parse(decodeURIComponent(escape(atob(code.trim()))))}catch(e){return null}}
function copySyncCode(){const code=genSyncCode();navigator.clipboard.writeText(code).then(()=>toast('同步码已复制')).catch(()=>toast('复制失败'))}
async function importSyncCode(){const code=prompt('请粘贴同步码：');if(!code||!code.trim())return;const d=parseSyncCode(code);if(!d||!d.t){toast('同步码无效');return}expandStorage(d);saveData();renderAll();toast('同步成功 ✅')}

function renderSync(){const sc=genSyncCode(),sz=getStorageSize();let h='<h1 class="page-title">🔄 设备同步</h1>';h+=`<div class="card"><div class="card-title">同步码</div><div style="font-size:11px;color:var(--md-on-surface-variant);margin-bottom:8px">源设备生成 → 复制 → 目标设备粘贴导入</div><div class="sync-code">${sc}</div><div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn btn-primary btn-sm" onclick="copySyncCode()">📋 复制</button><button class="btn btn-outline btn-sm" onclick="importSyncCode()">📥 导入</button></div><div style="font-size:11px;color:var(--md-outline)">📦 ${fmtStorage(sz)} · ${appData.transactions.length} 笔</div></div>`;h+=`<div class="card"><div class="card-title">文件方式</div><div style="display:flex;flex-direction:column;gap:8px"><button class="btn btn-outline btn-block" onclick="exportData()">📤 导出 JSON</button><button class="btn btn-outline btn-block" onclick="document.getElementById('importFile').click()">📥 导入 JSON</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"></div></div>`;h+=`<div class="card" style="background:var(--md-primary-container);border:none"><div style="font-size:11px;color:var(--md-on-primary-container);line-height:1.8">💡 <b>推荐:</b> 将 JSON 放 iCloud Drive / OneDrive / 坚果云同步文件夹<br>或用同步码通过微信/备忘录跨设备传输</div></div>`;$('#contentArea').innerHTML=h}

function renderSettings(){const sz=getStorageSize(),tc=appData.transactions.length;let h='<h1 class="page-title">⚙️ 设置</h1>';h+=`<div class="card"><div class="card-title">数据管理</div><div style="margin-bottom:10px;font-size:12px;color:var(--md-on-surface-variant)">📦 ${fmtStorage(sz)} · ${tc} 笔</div><div style="display:flex;flex-direction:column;gap:8px"><button class="btn btn-outline btn-block" onclick="exportData()">📤 导出 JSON</button><button class="btn btn-outline btn-block" onclick="document.getElementById('importFileS').click()">📥 导入 JSON</button><input type="file" id="importFileS" accept=".json" style="display:none" onchange="importData(event)"><button class="btn btn-outline btn-block" onclick="confirmCleanOld()">🧹 清理旧记录</button><button class="btn btn-error btn-block" onclick="confirmReset()">🗑️ 清除 + 示例</button></div></div>`;h+=`<div class="card"><div class="card-title">关于</div><div style="font-size:12px;color:var(--md-on-surface-variant);line-height:1.8">🐷 <b>打工人小账本 · 安卓版</b><br>Material Design 3 · 离线可用<br>zzh工作室 · ${new Date().getFullYear()}</div></div>`;$('#contentArea').innerHTML=h}

function exportData(){const blob=new Blob([JSON.stringify({transactions:appData.transactions,settings:appData.settings,goals:appData.goals},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='打工账本_'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('已导出')}
function importData(e){const file=e.target.files[0];if(!file){e.target.value='';return}if(file.size>10*1024*1024){toast('文件过大');e.target.value='';return}const r=new FileReader();r.onerror=()=>{toast('读取失败');e.target.value=''};r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d||typeof d!=='object')throw new Error('格式错');if(d.v===STORAGE_VERSION&&Array.isArray(d.t))expandStorage(d);else if(Array.isArray(d.transactions)){appData.transactions=d.transactions.filter(tx=>tx&&tx.id&&tx.date);if(d.settings)appData.settings={...appData.settings,...d.settings};if(d.goals)appData.goals={...appData.goals,...d.goals}}else throw new Error('格式错');saveData();renderAll();toast('已导入')}catch(ex){toast('导入失败')}e.target.value=''};r.readAsText(file)}

function confirmDeleteTxn(id){const t=appData.transactions.find(x=>x.id===id);if(!t)return;$('#confirmMsg').textContent=`删除「${t.category} ${fmtMoney(t.amount)}」？`;$('#confirmModal').classList.add('show');confirmCallback=()=>{deleteTxn(id);renderAll();closeModal();toast('已删除')};$('#confirmBtn').onclick=()=>confirmCallback&&confirmCallback()}
function closeModal(){$('#confirmModal').classList.remove('show');confirmCallback=null}
function confirmReset(){$('#confirmMsg').textContent='清除所有数据并加载示例？';$('#confirmModal').classList.add('show');confirmCallback=()=>{recSessionCount=0;generateDemoData();saveData();renderAll();closeModal();toast('已重置')};$('#confirmBtn').onclick=()=>confirmCallback&&confirmCallback()}
function confirmCleanOld(){const c=new Date();c.setMonth(c.getMonth()-6);const cs=c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-01',oc=appData.transactions.filter(t=>t.date<cs).length;if(oc===0){toast('没有旧记录');return}$('#confirmMsg').textContent=`删除 ${oc} 笔超过6个月的旧记录？`;$('#confirmModal').classList.add('show');confirmCallback=()=>{appData.transactions=appData.transactions.filter(t=>t.date>=cs);saveData();renderAll();closeModal();toast(`已清理 ${oc} 笔`)};$('#confirmBtn').onclick=()=>confirmCallback&&confirmCallback()}
$('#confirmModal').addEventListener('click',function(e){if(e.target===this)closeModal()});

function navigateTo(page){try{currentPage=page;$$('.bn-item').forEach(el=>el.classList.toggle('active',el.dataset.page===page));renderAll()}catch(e){toast('页面异常')}}
function renderAll(){try{switch(currentPage){case'home':renderHome();break;case'record':renderRecord();break;case'savings':renderSavings();break;case'sync':renderSync();break;case'settings':renderSettings();break}}catch(e){const ca=$('#contentArea');if(ca)ca.innerHTML='<div style="text-align:center;padding:40px;color:var(--md-outline)"><p>😵 页面异常</p><button class="btn btn-outline btn-sm" style="margin-top:12px" onclick="navigateTo(\'settings\')">前往设置</button></div>'}const a=$('#contentArea');if(a)a.innerHTML+='<div style="text-align:center;font-size:10px;color:var(--md-outline);padding:8px 0 4px" class="zzh-copy">zzh工作室 · 2026</div>'}
document.addEventListener('click',function(e){const n=e.target.closest('.bn-item');if(n)navigateTo(n.dataset.page)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

loadData();navigateTo('home');
</script>
</body>
</html>
